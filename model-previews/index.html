<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HAIRLOOM · MODEL PREVIEWS</title>
  <link rel="stylesheet" href="/model-previews/styles.css?v=20260802-model-previews-v1">
</head>
<body>
  <main>
    <header><div><small>HAIRLOOM OPERATOR</small><h1>Loading Model Library</h1></div><a href="/">HAIRLOOM ↗</a></header>
    <p class="intro">AI 결과를 기다리는 동안 표시할 실제 모델 사진을 이 브라우저에만 등록합니다. 사진은 생성 입력이나 Design Lock에 사용되지 않습니다.</p>
    <section class="workspace">
      <form id="previewForm">
        <h2>모델 사진 등록</h2>
        <label>표시 이름<input id="title" maxlength="80" placeholder="예: 강남점 여성 미디엄 웨이브" required></label>
        <div class="row"><label>성별<select id="gender"><option value="U">전체</option><option value="F">여성</option><option value="M">남성</option></select></label><label>기장<select id="length"><option value="">전체</option><option value="US">초단기장</option><option value="S">단기장</option><option value="MD">중간기장</option><option value="L">장기장</option><option value="XL">초장기장</option></select></label></div>
        <label>질감<select id="texture"><option value="">전체</option><option value="0">스트레이트</option><option value="1">웨이브</option><option value="2">컬</option><option value="3">코일</option></select></label>
        <div class="source-tabs"><button type="button" class="on" data-source-tab="salon">살롱 파일</button><button type="button" data-source-tab="web">인터넷 URL</button></div>
        <input id="sourceKind" type="hidden" value="salon">
        <label id="fileField">사진 파일<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" required></label>
        <label id="urlField" hidden>HTTPS 이미지 URL<input id="imageUrl" type="url" placeholder="https://..."><small>CORS로 가져올 수 없는 사이트는 사진을 다운로드한 뒤 살롱 파일로 등록하세요.</small></label>
        <label>권리 근거<select id="rights"><option value="salon-owned">살롱 소유 촬영물</option><option value="model-consented">모델 사용 동의</option><option value="licensed-stock">라이선스 스톡</option><option value="public-domain">퍼블릭 도메인</option></select></label>
        <label>출처·크레딧<input id="attribution" maxlength="160" placeholder="살롱명 · 모델/촬영 동의 기록 또는 라이선스 출처" required></label>
        <label class="confirm"><input id="consent" type="checkbox" required><span>표시 권리와 모델 초상 사용 동의를 확인했습니다.</span></label>
        <button class="save" type="submit">이 브라우저에 등록</button>
        <div id="status" aria-live="polite"></div>
      </form>
      <section class="library"><div class="library-head"><div><small>DISPLAY ONLY</small><h2>등록된 모델</h2></div><b id="count">0</b></div><div id="previewList" class="preview-list"></div></section>
    </section>
  </main>
  <script type="module" src="/model-previews/app.mjs?v=20260802-model-previews-v1"></script>
</body>
</html>
