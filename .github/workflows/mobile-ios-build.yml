name: Mobile iOS Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/mobile-ios-build.yml'
      - 'capacitor.config.json'
      - 'consultation/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/prepareMobileAssets.mjs'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: mobile-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run mobile:prepare
      - run: npx cap copy ios
      - run: pod install --deployment
        working-directory: ios/App
      - name: Build unsigned iOS simulator app
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
